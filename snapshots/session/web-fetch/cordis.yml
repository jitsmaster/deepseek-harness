# Web-fetch composition for the web-fetch snapshot scenario. The base bundle
# supplies the web seam and public HTTP provider; this overlay inserts a
# deterministic provider and exposes only fetch.
- insert:
    - id: web-fetch-fixture
      name: './web-fetch-fixture-server.mjs'

- id: web
  name: '@deepseek-ai/dsh-web'

- id: web-fetch-http
  name: '@deepseek-ai/dsh-web-fetch-http'
  disabled: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    search: false
    # The headless composition has no approval answerer and this scenario's
    # recorded session predates the per-call web_fetch approval; the fixture
    # server is deterministic loopback content, not a public host.
    fetchApproval: false
